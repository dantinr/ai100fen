# Testing/preview host only. Do not use this robots policy for production hosts.
server {
    listen 80;
    listen [::]:80;
    server_name ai100.aicsi.cn;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://ai100.aicsi.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ai100.aicsi.cn;
    root /var/www/ai100fen/public;
    index index.php;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/ai100.aicsi.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai100.aicsi.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    access_log /var/log/nginx/ai100fen.access.log;
    error_log /var/log/nginx/ai100fen.error.log warn;
    client_max_body_size 10m;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Override the shared robots file only on this testing host.
    # Inherit the server headers; location-level add_header would replace them.
    location = /robots.txt {
        alias /var/www/ai100fen/deploy/robots-testing.txt;
        default_type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
